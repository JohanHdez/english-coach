<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Coach</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <h1>English Coach</h1>
        <span class="clock" id="clock" hidden></span>
      </div>
      <button id="settings" class="icon" title="Ajustes">⚙</button>
    </header>

    <section class="controls">
      <label class="field">
        <span>Idioma de la conversación</span>
        <select id="lang">
          <option value="en">Inglés — con coach y traducción</option>
          <option value="es">Español — apoyo profesional</option>
          <option value="multi">Reunión bilingüe — inglés y español</option>
        </select>
      </label>

      <label class="field">
        <span>Audio del interlocutor</span>
        <select id="themSource">
          <option value="tab">Pestaña actual (Meet, Zoom web, YouTube…)</option>
          <option value="device">Dispositivo de entrada (loopback / apps de escritorio)</option>
          <option value="none">Ninguno (solo mi voz)</option>
        </select>
      </label>

      <label class="field" id="deviceField" hidden>
        <span>Dispositivo</span>
        <select id="themDevice"></select>
      </label>

      <label class="check">
        <input type="checkbox" id="captureMic" checked />
        <span>Grabar también mi micrófono</span>
      </label>

      <label class="field">
        <span>Contexto de hoy <span class="hint">· opcional</span></span>
        <textarea id="sessionContext" rows="2" placeholder="entrevista técnica de Angular: signals, RxJS…"></textarea>
      </label>

      <button id="toggle" class="primary">● Empezar</button>
      <p id="status" class="status">Listo.</p>
      <p id="liveNote" class="live-note" hidden>
        <span id="liveNoteText"></span>
        <button id="liveNoteAction" class="linky" hidden>Instalar paquete de idioma</button>
      </p>
    </section>

    <section id="coach" class="coach" hidden>
      <div class="tabs">
        <button id="tabPhrases" class="tab" type="button">Frases <span class="count"></span></button>
        <button id="tabNotes" class="tab" type="button">Notas <span class="count"></span></button>
        <button id="askReply" class="small ghost" title="También con ⌘⇧E / Ctrl+Shift+E">💡 Respuesta</button>
      </div>
      <div id="phrasesPane" class="pane">
        <div id="cats" class="cats"></div>
        <div id="phrases" class="chip-list"></div>
      </div>
      <div id="notesPane" class="pane" hidden>
        <div id="notes" class="note-list"></div>
      </div>
      <div id="replyBox" class="reply" hidden>
        <p id="replyStatus" class="reply-status" hidden></p>
        <div id="replyAnswer" class="reply-group" hidden>
          <span class="reply-label">Di esto</span>
          <div class="reply-list"></div>
        </div>
        <div id="replyIdeas" class="reply-group" hidden>
          <span class="reply-label">Para estudiar después</span>
          <div class="reply-list"></div>
        </div>
      </div>
    </section>

    <div class="transcript-wrap">
      <section id="transcript" class="transcript">
        <p class="empty">Aquí aparecerá la conversación transcrita.</p>
      </section>
      <div class="overlays">
        <button id="jump" class="jump" type="button" hidden></button>
        <div id="sticky" class="sticky" hidden></div>
      </div>
    </div>

    <div id="partialThem" class="partial" hidden>
      <span class="meta">Interlocutor · hablando ahora</span>
      <span id="partialThemEn"></span><span id="partialThemTail" class="partial-tail"></span>
      <span id="partialThemEs" class="es"></span>
    </div>
    <div id="partialMe" class="partial me" hidden>
      <span class="meta">Yo · hablando ahora</span>
      <span id="partialMeEn"></span><span id="partialMeTail" class="partial-tail"></span>
    </div>

    <footer>
      <div class="row">
        <button id="pause" class="small" hidden>⏸ Pausar</button>
        <button id="report" class="primary small">📊 Informe de la sesión</button>
      </div>
      <div class="row">
        <button id="analyze" class="small">Copiar prompt</button>
        <button id="download" class="small">Descargar</button>
        <button id="clear" class="small danger">Limpiar</button>
      </div>
    </footer>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
